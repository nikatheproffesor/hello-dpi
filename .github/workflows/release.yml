name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package All Targets
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Tests
        run: |
          go test -v ./...

      - name: Build macOS App & DMG
        run: |
          chmod +x scripts/build-macos-app.sh
          ./scripts/build-macos-app.sh

      - name: Build Windows Binaries
        run: |
          mkdir -p bin
          echo "Building Portable Windows Tray Executable..."
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o bin/HelloDPI-Windows.exe ./cmd/hellodpi-tray
          
          echo "Building Windows 1-Click Setup Installer..."
          mkdir -p cmd/hellodpi-installer/embedded
          cp bin/HelloDPI-Windows.exe cmd/hellodpi-installer/embedded/HelloDPI.exe
          cp Baslat.bat cmd/hellodpi-installer/embedded/Baslat.bat
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o bin/HelloDPI-Setup.exe ./cmd/hellodpi-installer

      - name: Build Linux Engine
        run: |
          echo "Building Linux x86_64 Executable..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/hellodpi-linux-amd64 ./cmd/hellodpi

      - name: Build Android APK
        run: |
          echo "Building Android ARM64 Core Binary & APK..."
          mkdir -p mobile/android/app/src/main/jniLibs/arm64-v8a
          GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o mobile/android/app/src/main/jniLibs/arm64-v8a/libhellodpi.so ./cmd/hellodpi
          cp mobile/android/app/src/main/jniLibs/arm64-v8a/libhellodpi.so bin/hellodpi-android-arm64
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ../..
          cp mobile/android/app/build/outputs/apk/release/app-release.apk bin/HelloDPI-Android.apk

      - name: Verify Release Artifacts
        run: |
          ls -lh bin/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bin/HelloDPI-Setup.exe
            bin/HelloDPI-macOS.dmg
            bin/HelloDPI-macOS.zip
            bin/HelloDPI-Android.apk
            bin/hellodpi-android-arm64
            bin/hellodpi-linux-amd64
          generate_release_notes: true
          draft: false
          prerelease: false

name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package All Targets
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Prepare Embedded Assets
        run: |
          mkdir -p cmd/hellodpi-installer/embedded
          touch cmd/hellodpi-installer/embedded/HelloDPI.exe
          touch cmd/hellodpi-installer/embedded/Baslat.bat

      - name: Build macOS App & DMG
        run: |
          chmod +x scripts/build-macos-app.sh
          ./scripts/build-macos-app.sh

      - name: Build Windows Binaries
        run: |
          mkdir -p bin
          echo "Building Portable Windows Tray Executable..."
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H=windowsgui -buildid=" -o bin/HelloDPI-Windows.exe ./cmd/hellodpi-tray

          echo "Packaging Windows ZIP Archive (Avoids Browser .exe block and AV False Positives)..."
          zip -j bin/HelloDPI-Windows.zip bin/HelloDPI-Windows.exe Baslat.bat Reset-Network.bat rules.json LICENSE


      - name: Build Linux & OpenWrt Binaries
        run: |
          echo "Building Linux x86_64 Executable..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/hellodpi-linux-amd64 ./cmd/hellodpi

          echo "Building Linux / OpenWrt ARM64 Executable..."
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/hellodpi-linux-arm64 ./cmd/hellodpi

          echo "Building OpenWrt MIPSLE Executable..."
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/hellodpi-openwrt-mipsle ./cmd/hellodpi

      - name: Build Android Core & APK
        continue-on-error: true
        run: |
          echo "Building Android ARM64 Core Binary & APK..."
          mkdir -p mobile/android/app/src/main/jniLibs/arm64-v8a
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o mobile/android/app/src/main/jniLibs/arm64-v8a/libhellodpi.so ./cmd/hellodpi
          cp mobile/android/app/src/main/jniLibs/arm64-v8a/libhellodpi.so bin/hellodpi-android-arm64
          if [ -d "$ANDROID_HOME" ] || [ -d "$ANDROID_SDK_ROOT" ]; then
            cd mobile/android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon || true
            cd ../..
            if [ -f "mobile/android/app/build/outputs/apk/release/app-release.apk" ]; then
              cp mobile/android/app/build/outputs/apk/release/app-release.apk bin/HelloDPI-Android.apk
            elif [ -f "mobile/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
              cp mobile/android/app/build/outputs/apk/debug/app-debug.apk bin/HelloDPI-Android.apk
            fi
          fi

      - name: Verify Release Artifacts
        run: |
          ls -lh bin/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bin/HelloDPI-Windows.zip
            bin/HelloDPI-Windows.exe
            bin/HelloDPI-macOS.dmg
            bin/HelloDPI-macOS.zip
            bin/HelloDPI-Android.apk
            bin/hellodpi-android-arm64
            bin/hellodpi-linux-amd64
            bin/hellodpi-linux-arm64
            bin/hellodpi-openwrt-mipsle
          generate_release_notes: true
          draft: false
          prerelease: false

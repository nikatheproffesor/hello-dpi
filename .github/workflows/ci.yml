name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Prepare Embedded Assets for Vet
        run: |
          mkdir -p cmd/hellodpi-installer/embedded
          touch cmd/hellodpi-installer/embedded/HelloDPI.exe
          touch cmd/hellodpi-installer/embedded/Baslat.bat

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted according to gofmt:"
            gofmt -d .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Cross-Compilation Check (Linux, Windows, OpenWrt)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/hellodpi-tray
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/hellodpi
          GOOS=linux GOARCH=mipsle CGO_ENABLED=0 go build -o /dev/null ./cmd/hellodpi
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/hellodpi
